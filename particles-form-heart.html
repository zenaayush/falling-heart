<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Particle Heart</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
  }

  #scene {
    position: fixed;
    inset: 0;
    display: block;
  }

  .signature {
    position: fixed;
    bottom: 16px;
    width: 100%;
    text-align: center;
    font-family: -apple-system, "Segoe UI", sans-serif;
    font-size: 12px;
    letter-spacing: 0.5px;
    color: rgba(80, 255, 150, 0.25);
    pointer-events: none;
  }
</style>
</head>
<body>

<canvas id="scene"></canvas>
<p class="signature">made with 💚</p>

<script>
/*
 * Particles fall from the top of the screen, drift for a while, then
 * slowly get pulled into place until together they trace out a heart.
 * Once everyone's home, the whole shape breathes gently like a pulse.
 */

const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');

const settings = {
  particleArea: 3800,       // smaller number = more particles packed on screen
  formationSeconds: 13,     // roughly how long it takes for the heart to fully appear
  heartSizeRatio: 0.24,     // heart size relative to the shorter screen dimension
  outlineShare: 0.68,       // fraction of heart particles that trace the outline vs. fill the inside
  backgroundShare: 0.35     // fraction of all particles that just keep falling forever, never joining the heart
};

let w = 0, h = 0;
let particles = [];
let frameCount = 0;
let fps = 60; // assumed, used only to translate "seconds" into frame counts

function rand(min, max) {
  return min + Math.random() * (max - min);
}

// A handful of close, natural-looking greens instead of one flat color
const greenShades = [
  [140, 255, 190],
  [110, 240, 165],
  [180, 255, 205],
  [90, 220, 150]
];

function pickShade() {
  return greenShades[Math.floor(Math.random() * greenShades.length)];
}

// The classic parametric heart curve. Returns a point roughly in the -1..1 range.
function heartCurve(t) {
  const x = 16 * Math.sin(t) ** 3;
  const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
  return { x: x / 16, y: y / 16 };
}

function center() {
  return { x: w / 2, y: h / 2 };
}

function heartRadius() {
  return Math.min(w, h) * settings.heartSizeRatio;
}

function makeTarget(index, total) {
  const c = center();
  const r = heartRadius();
  const onOutline = index < total * settings.outlineShare;

  // spread outline points evenly around the curve, with a little jitter so
  // it doesn't look mechanically perfect
  const t = onOutline
    ? (index / (total * settings.outlineShare)) * Math.PI * 2 + rand(-0.015, 0.015)
    : rand(0, Math.PI * 2);

  const p = heartCurve(t);
  const depth = onOutline ? rand(0.94, 1.02) : rand(0.1, 0.85);

  return {
    x: c.x + p.x * r * depth,
    y: c.y + p.y * r * depth
  };
}

function newParticle(index, heartTotal, isBackground) {
  const size = rand(0.7, 2.2);
  const formationFrames = settings.formationSeconds * fps;

  return {
    x: rand(0, w),
    y: rand(-h, 0),
    size,
    shade: pickShade(),
    isBackground,

    // falling phase
    fallSpeed: rand(0.5, 2) * (size / 1.2),
    sway: rand(-0.3, 0.3),

    // when it starts homing toward its spot, and how eagerly
    // (irrelevant for background particles, they just fall forever)
    delay: rand(0, formationFrames),
    ease: rand(0.01, 0.02),

    target: isBackground ? null : makeTarget(index, heartTotal),
    home: false,

    // subtle per-particle twinkle
    glow: rand(0.35, 1),
    glowSpeed: rand(0.006, 0.018),
    glowDir: 1,
    wobble: rand(0, Math.PI * 2)
  };
}

function buildParticles() {
  const total = Math.round((w * h) / settings.particleArea);
  const backgroundCount = Math.round(total * settings.backgroundShare);
  const heartCount = total - backgroundCount;

  particles = [];
  for (let i = 0; i < heartCount; i++) {
    particles.push(newParticle(i, heartCount, false));
  }
  for (let i = 0; i < backgroundCount; i++) {
    particles.push(newParticle(i, heartCount, true));
  }
}

function resize() {
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
  buildParticles();
}

function drawParticle(p) {
  const [r, g, b] = p.shade;

  // soft outer glow
  const halo = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size * 4.5);
  halo.addColorStop(0, `rgba(${r}, ${g}, ${b}, ${p.glow})`);
  halo.addColorStop(0.45, `rgba(${r}, ${g}, ${b}, ${p.glow * 0.35})`);
  halo.addColorStop(1, `rgba(${r}, ${g}, ${b}, 0)`);
  ctx.fillStyle = halo;
  ctx.beginPath();
  ctx.arc(p.x, p.y, p.size * 4.5, 0, Math.PI * 2);
  ctx.fill();

  // bright core
  ctx.fillStyle = `rgba(230, 255, 240, ${p.glow})`;
  ctx.beginPath();
  ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
  ctx.fill();
}

function updateFalling(p) {
  p.y += p.fallSpeed;
  p.x += p.sway;
  if (p.y > h + 10) {
    p.y = rand(-40, -10);
    p.x = rand(0, w);
  }
}

function updateHoming(p) {
  const dx = p.target.x - p.x;
  const dy = p.target.y - p.y;
  p.x += dx * p.ease;
  p.y += dy * p.ease;
  if (Math.abs(dx) < 0.5 && Math.abs(dy) < 0.5) {
    p.home = true;
  }
}

// A heartbeat isn't a plain sine wave — it's a quick double-thump, then a rest.
// This fakes that with two overlapping pulses.
function beatScale(t) {
  const cycle = t % 90;
  const thump1 = Math.exp(-Math.pow((cycle - 6) / 5, 2));
  const thump2 = Math.exp(-Math.pow((cycle - 20) / 6, 2)) * 0.6;
  return 1 + (thump1 + thump2) * 0.06;
}

function updateSettled(p, beat) {
  const c = center();
  const bx = c.x + (p.target.x - c.x) * beat;
  const by = c.y + (p.target.y - c.y) * beat;
  p.x += (bx - p.x) * 0.18 + Math.sin(frameCount * 0.03 + p.wobble) * 0.04;
  p.y += (by - p.y) * 0.18 + Math.cos(frameCount * 0.03 + p.wobble) * 0.04;
}

function updateGlow(p) {
  p.glow += p.glowSpeed * p.glowDir;
  if (p.glow >= 1) { p.glow = 1; p.glowDir = -1; }
  if (p.glow <= 0.3) { p.glow = 0.3; p.glowDir = 1; }
}

function tick() {
  ctx.clearRect(0, 0, w, h);
  frameCount++;

  const beat = beatScale(frameCount);

  for (const p of particles) {
    if (p.isBackground) {
      updateFalling(p);
    } else if (p.home) {
      updateSettled(p, beat);
    } else if (frameCount > p.delay) {
      updateHoming(p);
    } else {
      updateFalling(p);
    }

    updateGlow(p);
    drawParticle(p);
  }

  requestAnimationFrame(tick);
}

window.addEventListener('resize', resize);
resize();
tick();
</script>

</body>
</html>
